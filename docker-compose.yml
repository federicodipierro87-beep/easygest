name: easygest

services:
  postgres:
    # Stessa major di Railway in produzione: una differenza di versione fra i
    # due ambienti si scopre sempre nel momento peggiore.
    image: postgres:18-alpine
    container_name: easygest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: easygest
      POSTGRES_PASSWORD: easygest
      POSTGRES_DB: easygest
    ports:
      # Non 5432 né 5433: su Windows un Postgres nativo e Docker possono
      # mettersi in ascolto sulla stessa porta senza che nessuno dei due dia
      # errore, e le connessioni finiscono in modo stabile a chi ha vinto il
      # bind. Si manifesta come «autenticazione fallita» contro un server che
      # sembra il proprio e non lo è: mezz'ora persa a cercare la password
      # sbagliata. Una porta alta e improbabile toglie il problema di mezzo.
      - '55432:5432'
    volumes:
      # Dalla 18 l'immagine ufficiale vuole il mount su `/var/lib/postgresql`,
      # non più su `/var/lib/postgresql/data`: i dati finiscono in una
      # sottocartella per major, così `pg_upgrade --link` non deve attraversare
      # un mount point. Con il percorso vecchio il container non parte affatto.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U easygest -d easygest']
      interval: 5s
      timeout: 5s
      retries: 12

  # MinIO è S3-compatible: in locale sostituisce Cloudflare R2 senza cambiare
  # una riga di codice applicativo, basta cambiare endpoint e credenziali.
  minio:
    image: minio/minio:latest
    container_name: easygest-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: easygest
      MINIO_ROOT_PASSWORD: easygest-dev-secret
    ports:
      - '9000:9000' # API S3
      - '9001:9001' # console web
    volumes:
      - minio-data:/data

  # Crea il bucket al primo avvio e imposta il CORS necessario agli upload
  # presigned fatti direttamente dal browser in sviluppo.
  minio-init:
    image: minio/mc:latest
    container_name: easygest-minio-init
    depends_on:
      - minio
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 easygest easygest-dev-secret; do
        echo 'attendo MinIO...'; sleep 2;
      done;
      mc mb --ignore-existing local/easygest-documents;
      mc anonymous set none local/easygest-documents;
      echo 'bucket easygest-documents pronto';
      "

volumes:
  postgres-data:
  minio-data:
